{% extends 'base.html' %}

{% block title %}Edit Business Type - RonoSystems{% endblock %}
{% block page_title %}Edit Business Type{% endblock %}
{% block page_subtitle %}{{ business_type.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label required">Business Type Name</label>
                        <select class="form-select" name="name" required>
                            <option value="{{ business_type.name }}">{{ business_type.name }}</option>
                            {% for type in available_types %}
                            <option value="{{ type.name }}">{{ type.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3">{{ business_type.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Icon Class</label>
                        <input type="text" class="form-control" name="icon" value="{{ business_type.icon }}">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="is_active" id="isActive" {% if business_type.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="isActive">Active</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Business Type
                        </button>
                        <a href="/business-types/" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
