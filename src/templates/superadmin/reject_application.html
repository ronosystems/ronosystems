{% extends "base.html" %}

{% block title %}Reject Application{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-times-circle me-2"></i> Reject Application</h5>
                </div>
                <div class="card-body p-4">
                    <p>Are you sure you want to reject the application from <strong>{{ application.company_name }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Reason (optional)</label>
                            <textarea name="reason" class="form-control" rows="3" placeholder="Why is this application being rejected?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">
                            <i class="fas fa-times"></i> Confirm Rejection
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
