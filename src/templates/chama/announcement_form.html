{% extends 'chama_base.html' %}
{% block title %}New Announcement{% endblock %}
{% block page_title %}New Announcement{% endblock %}
{% block content %}
<div class="container-fluid py-2">
    <div class="card" style="border:2px solid #000; border-radius:4px; max-width:700px; margin:0 auto;">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="fw-bold">Title</label>{{ form.title }}</div>
                <div class="mb-3"><label class="fw-bold">Message</label>{{ form.message }}</div>
                <div class="form-check mb-3">{{ form.is_active }} <label class="form-check-label fw-bold">Make Active</label></div>
                <button type="submit" class="btn btn-dark fw-bold" style="border:2px solid #000;">Post Announcement</button>
                <a href="{% url 'chama:announcement_list' %}" class="btn btn-outline-dark" style="border:2px solid #000;">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
