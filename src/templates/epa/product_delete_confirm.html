{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2>{{ page_title }}</h2>
  <p class="text-muted">{{ page_subtitle }}</p>

  <div class="alert alert-danger">
    <strong>Warning:</strong> This action cannot be undone.
    Deleting <strong>{{ product.name }}</strong> ({{ product_type }})
    will also remove all associated units.
  </div>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="/epa_shop/products/" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
