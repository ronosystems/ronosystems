<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Labels</title>
<style>
  /* Change to match your roll size (50mm x 25mm here) */
  @page { size: 50mm 25mm; margin: 0; }

  body { margin: 0; font-family: Arial, sans-serif; }

  .label {
    width: 50mm;
    height: 25mm;
    box-sizing: border-box;
    padding: 1mm;
    text-align: center;
    page-break-after: always;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .label img {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }
</style>
</head>
<body>

{% for p in products %}
  <div class="label">
    <img src="{% url 'barcode_png' kind p.pk %}" alt="{{ p.product_code }}">
  </div>
{% endfor %}

<script>window.onload = () => window.print();</script>
</body>
</html>
