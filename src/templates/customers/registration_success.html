{% extends "web_base.html" %}
{% load static %}

{% block title %}Registration Successful{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 p-5" style="border-radius: 12px;">
                <i class="fas fa-check-circle text-success mb-3" style="font-size: 4rem;"></i>
                <h2 class="fw-bold">You're In!</h2>
                <p class="text-muted mt-3 mb-4">
                    Thank you, <strong>{{ customer.full_name }}</strong>. You have successfully joined <strong>{{ customer.company.display_name }}</strong>.
                </p>
                <a href="/" class="btn btn-lg text-white fw-bold" style="background-color: #036a77; border-radius: 8px;">
                    Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
