{% extends "customer_base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 500px; border-radius: 12px;">
        <div class="card-body p-5">
            <i class="fas fa-tools text-warning mb-3" style="font-size: 4rem;"></i>
            <h2 class="fw-bold mb-3">{{ page_title }} Coming Soon</h2>
            <p class="text-muted mb-4">
                We are currently working hard to bring you this feature. Please check back later!
            </p>
            <a href="{% url 'customers:dashboard' %}" class="btn btn-primary fw-bold px-4 py-2" style="border-radius: 50px;">
                <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
