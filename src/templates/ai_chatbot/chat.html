{% extends active_base_template|default:"web_base.html" %}
{% load static %}

{% block content %}
<div class="container py-5" style="max-width: 800px;">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white d-flex align-items-center gap-2">
      <i class="fas fa-robot"></i>
      <span class="fw-bold">
        {% if scope == 'company' %}Business Assistant{% else %}RonoSystems Assistant{% endif %}
      </span>
    </div>

    <div id="chat-log" class="card-body"
         style="height: 500px; overflow-y: auto; background: #f8f9fa;"></div>

    <div class="card-footer bg-white">
      <form id="chat-form" class="d-flex gap-2">
        <input id="chat-input" type="text" class="form-control"
               placeholder="Ask me anything…" autocomplete="off" required>
        <button class="btn btn-primary" type="submit">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
const log   = document.getElementById('chat-log');
const form  = document.getElementById('chat-form');
const input = document.getElementById('chat-input');
const url   = "{% url 'ai_chatbot:send' %}";

function append(role, text) {
  const div = document.createElement('div');
  div.className = 'mb-2 d-flex ' + (role === 'user' ? 'justify-content-end' : 'justify-content-start');
  div.innerHTML = `
    <div class="px-3 py-2 rounded-3 ${role === 'user'
      ? 'bg-primary text-white' : 'bg-white border'}">
      ${text}
    </div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;
  append('user', msg);
  input.value = '';
  input.disabled = true;

  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ message: msg }),
    });
    const data = await r.json();
    append('assistant', data.reply || data.error || 'No reply.');
  } catch (err) {
    append('assistant', 'Network error — please try again.');
  } finally {
    input.disabled = false;
    input.focus();
  }
});

function getCookie(name) {
  const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return m ? decodeURIComponent(m.pop()) : '';
}
</script>
{% endblock %}
