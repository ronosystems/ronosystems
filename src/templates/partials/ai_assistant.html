{% comment %}
   AI ASSISTANT — Floating chat widget
   Usage: { percent include 'partials/ai_assistant.html' percent }
{% endcomment %}

<style>
    /* Floating button */
    .ai-fab {
        position: fixed;
        right: 22px;
        bottom: 22px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--nav-bg-top, #2d5f7c), var(--nav-bg-bottom, #1e4e6d));
        color: #fff;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        z-index: 3000;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .ai-fab:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 10px 28px rgba(0,0,0,0.4);
    }
    .ai-fab::after {
        content: "";
        position: absolute;
        top: 6px;
        right: 6px;
        width: 10px;
        height: 10px;
        background: #7bc043;
        border-radius: 50%;
        border: 2px solid #1e4e6d;
        animation: aiPulse 2s infinite;
    }
    @keyframes aiPulse {
        0%   { box-shadow: 0 0 0 0 rgba(123,192,67,0.6); }
        70%  { box-shadow: 0 0 0 8px rgba(123,192,67,0); }
        100% { box-shadow: 0 0 0 0 rgba(123,192,67,0); }
    }

    /* Chat panel */
    .ai-panel {
        position: fixed;
        right: 22px;
        bottom: 90px;
        width: 380px;
        max-width: calc(100vw - 32px);
        height: 520px;
        max-height: calc(100vh - 130px);
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 3000;
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .ai-panel.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
    }

    .ai-head {
        background: linear-gradient(135deg, var(--nav-bg-top, #2d5f7c), var(--nav-bg-bottom, #1e4e6d));
        color: #fff;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    .ai-head .ai-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .ai-head .ai-title i {
        font-size: 18px;
        color: #7bc043;
    }
    .ai-head .ai-status {
        font-size: 10px;
        color: #cbe6f5;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
    }
    .ai-close {
        background: transparent;
        border: none;
        color: #cbe6f5;
        font-size: 18px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background 0.15s, color 0.15s;
    }
    .ai-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .ai-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        background: #f7fafc;
        scrollbar-width: thin;
    }
    .ai-body::-webkit-scrollbar { width: 6px; }
    .ai-body::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }

    .ai-msg {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 13px;
        line-height: 1.55;
        animation: aiMsgIn 0.2s ease-out;
    }
    @keyframes aiMsgIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .ai-msg .ai-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #fff;
    }
    .ai-msg.bot .ai-avatar { background: var(--nav-bg-top, #2d5f7c); }
    .ai-msg.user .ai-avatar { background: #7bc043; }
    .ai-msg .ai-bubble {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 9px 12px;
        color: #2d3748;
        max-width: 82%;
        word-wrap: break-word;
    }
    .ai-msg.user {
        flex-direction: row-reverse;
    }
    .ai-msg.user .ai-bubble {
        background: #e8f5e0;
        border-color: #c8e6b4;
        color: #1e4e6d;
    }

    .ai-typing {
        display: flex;
        gap: 3px;
        align-items: center;
        padding: 9px 14px;
    }
    .ai-typing span {
        width: 6px;
        height: 6px;
        background: #a0aec0;
        border-radius: 50%;
        animation: aiTypingBounce 1.2s infinite;
    }
    .ai-typing span:nth-child(2) { animation-delay: 0.15s; }
    .ai-typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes aiTypingBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-5px); opacity: 1; }
    }

    .ai-foot {
        border-top: 1px solid #e2e8f0;
        padding: 10px;
        background: #fff;
        display: flex;
        gap: 8px;
        align-items: flex-end;
    }
    .ai-foot textarea {
        flex: 1;
        border: 1px solid #cbd5e0;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-family: inherit;
        resize: none;
        max-height: 100px;
        min-height: 40px;
        outline: none;
        transition: border-color 0.15s;
    }
    .ai-foot textarea:focus { border-color: var(--nav-bg-top, #2d5f7c); }
    .ai-foot button {
        background: var(--nav-bg-bottom, #1e4e6d);
        color: #fff;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: background 0.15s;
    }
    .ai-foot button:hover { background: var(--nav-bg-top, #2d5f7c); }
    .ai-foot button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Mobile */
    @media (max-width: 576px) {
        .ai-fab { right: 14px; bottom: 14px; width: 50px; height: 50px; font-size: 20px; }
        .ai-panel {
            right: 8px;
            bottom: 74px;
            width: calc(100vw - 16px);
            height: calc(100vh - 90px);
            max-height: none;
        }
    }
</style>

<!-- Floating button -->
<button type="button" class="ai-fab" id="aiFab" title="Ask the AI Assistant" aria-label="AI Assistant">
    <i class="fas fa-comment-dots"></i>
</button>

<!-- Chat panel -->
<div class="ai-panel" id="aiPanel" role="dialog" aria-label="AI Assistant chat">
    <div class="ai-head">
        <div class="ai-title">
            <i class="fas fa-robot"></i>
            <div>
                AI Assistant
                <div class="ai-status">Online · Ask me anything</div>
            </div>
        </div>
        <button type="button" class="ai-close" id="aiClose" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="ai-body" id="aiBody">
        <div class="ai-msg bot">
            <div class="ai-avatar"><i class="fas fa-robot"></i></div>
            <div class="ai-bubble">
                Hi 👋 I'm the RonoSystems AI Assistant. Ask me about features, pricing, or how to get started.
            </div>
        </div>
    </div>

    <form class="ai-foot" id="aiForm" autocomplete="off">
        <textarea id="aiInput" rows="1" placeholder="Type your message..." maxlength="500"></textarea>
        <button type="submit" id="aiSend" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
    </form>
</div>

<script>
(function() {
    const fab    = document.getElementById('aiFab');
    const panel  = document.getElementById('aiPanel');
    const close  = document.getElementById('aiClose');
    const form   = document.getElementById('aiForm');
    const input  = document.getElementById('aiInput');
    const send   = document.getElementById('aiSend');
    const body   = document.getElementById('aiBody');

    // Conversation history (sent to server for context)
    const history = [];

    // Endpoint — reads from a data-attribute on the script so each page can override
    const ENDPOINT = '/ai/assistant/';

    function openPanel() {
        panel.classList.add('open');
        setTimeout(() => input.focus(), 250);
    }
    function closePanel() { panel.classList.remove('open'); }

    fab.addEventListener('click', () => {
        panel.classList.contains('open') ? closePanel() : openPanel();
    });
    close.addEventListener('click', closePanel);

    // Any element with [data-ai-open] also opens the chat
    document.querySelectorAll('[data-ai-open]').forEach(el => {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            openPanel();
        });
    });

    // Escape closes
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
    });

    // Auto-grow textarea
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });

    // Enter sends, Shift+Enter adds newline
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            form.requestSubmit();
        }
    });

    function addMsg(text, who) {
        const el = document.createElement('div');
        el.className = 'ai-msg ' + who;
        el.innerHTML = `
            <div class="ai-avatar"><i class="fas fa-${who === 'bot' ? 'robot' : 'user'}"></i></div>
            <div class="ai-bubble"></div>
        `;
        el.querySelector('.ai-bubble').textContent = text;
        body.appendChild(el);
        body.scrollTop = body.scrollHeight;
        return el;
    }

    function addTyping() {
        const el = document.createElement('div');
        el.className = 'ai-msg bot';
        el.id = 'aiTypingIndicator';
        el.innerHTML = `
            <div class="ai-avatar"><i class="fas fa-robot"></i></div>
            <div class="ai-bubble ai-typing">
                <span></span><span></span><span></span>
            </div>
        `;
        body.appendChild(el);
        body.scrollTop = body.scrollHeight;
    }
    function removeTyping() {
        const t = document.getElementById('aiTypingIndicator');
        if (t) t.remove();
    }

    function getCsrf() {
        const m = document.cookie.match(/(^|;\s*)csrftoken=([^;]+)/);
        return m ? decodeURIComponent(m[2]) : '';
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'user');
        history.push({ role: 'user', content: text });
        input.value = '';
        input.style.height = 'auto';

        send.disabled = true;
        addTyping();

        try {
            const res = await fetch(ENDPOINT, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrf(),
                },
                body: JSON.stringify({
                    message: text,
                    history: history.slice(-8),
                }),
            });
            const data = await res.json().catch(() => ({}));
            removeTyping();

            const reply = data.reply || "Sorry, I didn't catch that. Try again?";
            addMsg(reply, 'bot');
            history.push({ role: 'assistant', content: reply });
        } catch (err) {
            removeTyping();
            addMsg("Connection error — please try again.", 'bot');
        } finally {
            send.disabled = false;
            input.focus();
        }
    });
})();
</script>
