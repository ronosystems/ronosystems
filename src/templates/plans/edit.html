{% extends 'base.html' %}

{% block title %}Edit Plan - RonoSystems{% endblock %}
{% block page_title %}Edit Plan{% endblock %}
{% block page_subtitle %}{{ plan.display_name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label required">Plan Name</label>
                            <select class="form-select" name="name" required>
                                <option value="free" {% if plan.name == 'free' %}selected{% endif %}>Free</option>
                                <option value="pro" {% if plan.name == 'pro' %}selected{% endif %}>Pro</option>
                                <option value="enterprise" {% if plan.name == 'enterprise' %}selected{% endif %}>Enterprise</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label required">Display Name</label>
                            <input type="text" class="form-control" name="display_name" value="{{ plan.display_name }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" name="price" step="0.01" value="{{ plan.price }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Currency</label>
                            <select class="form-select" name="currency">
                                {% for cur in currencies %}
                                <option value="{{ cur }}" {% if plan.currency == cur %}selected{% endif %}>{{ cur }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Billing Cycle</label>
                            <select class="form-select" name="billing_cycle">
                                {% for cycle in billing_cycles %}
                                <option value="{{ cycle.0 }}" {% if plan.billing_cycle == cycle.0 %}selected{% endif %}>{{ cycle.1 }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Max Employees</label>
                            <input type="number" class="form-control" name="max_employees" value="{{ plan.max_employees }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Max Companies</label>
                            <input type="number" class="form-control" name="max_companies" value="{{ plan.max_companies }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Max Storage (MB)</label>
                            <input type="number" class="form-control" name="max_storage" value="{{ plan.max_storage }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="2">{{ plan.description }}</textarea>
                    </div>

                    <h6 class="mt-3 mb-2">Features</h6>
                    <div class="row">
                        <div class="col-md-4 form-check">
                            <input type="checkbox" class="form-check-input" name="has_api_access" id="apiAccess" {% if plan.has_api_access %}checked{% endif %}>
                            <label class="form-check-label" for="apiAccess">API Access</label>
                        </div>
                        <div class="col-md-4 form-check">
                            <input type="checkbox" class="form-check-input" name="has_advanced_reports" id="advReports" {% if plan.has_advanced_reports %}checked{% endif %}>
                            <label class="form-check-label" for="advReports">Advanced Reports</label>
                        </div>
                        <div class="col-md-4 form-check">
                            <input type="checkbox" class="form-check-input" name="has_custom_branding" id="customBranding" {% if plan.has_custom_branding %}checked{% endif %}>
                            <label class="form-check-label" for="customBranding">Custom Branding</label>
                        </div>
                        <div class="col-md-4 form-check">
                            <input type="checkbox" class="form-check-input" name="has_priority_support" id="prioritySupport" {% if plan.has_priority_support %}checked{% endif %}>
                            <label class="form-check-label" for="prioritySupport">Priority Support</label>
                        </div>
                        <div class="col-md-4 form-check">
                            <input type="checkbox" class="form-check-input" name="has_bulk_import" id="bulkImport" {% if plan.has_bulk_import %}checked{% endif %}>
                            <label class="form-check-label" for="bulkImport">Bulk Import</label>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6 form-check">
                            <input type="checkbox" class="form-check-input" name="is_active" id="isActive" {% if plan.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="isActive">Active</label>
                        </div>
                        <div class="col-md-6 form-check">
                            <input type="checkbox" class="form-check-input" name="is_featured" id="isFeatured" {% if plan.is_featured %}checked{% endif %}>
                            <label class="form-check-label" for="isFeatured">Featured</label>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Plan
                        </button>
                        <a href="/plans/" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
