{% extends 'base.html' %}

{% block title %}Branch Form{% endblock %}


{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label required">Branch Name</label>
                            <input type="text" class="form-control" name="name" value="{{ branch.name|default:'' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Branch Code</label>
                            <input type="text" class="form-control" name="code" value="{{ branch.code|default:'' }}" placeholder="Auto-generated">
                            <small class="text-muted">Leave empty to auto-generate from name</small>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone" value="{{ branch.phone|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ branch.email|default:'' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" name="city" value="{{ branch.city|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" name="country" value="{{ branch.country|default:'' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" name="address" rows="2">{{ branch.address|default:'' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Currency</label>
                            <select class="form-select" name="currency">
                                <option value="KES" {% if branch.currency == 'KES' %}selected{% endif %}>KES - Kenyan Shilling</option>
                                <option value="USD" {% if branch.currency == 'USD' %}selected{% endif %}>USD - US Dollar</option>
                                <option value="EUR" {% if branch.currency == 'EUR' %}selected{% endif %}>EUR - Euro</option>
                                <option value="GBP" {% if branch.currency == 'GBP' %}selected{% endif %}>GBP - British Pound</option>
                                <option value="UGX" {% if branch.currency == 'UGX' %}selected{% endif %}>UGX - Ugandan Shilling</option>
                                <option value="TZS" {% if branch.currency == 'TZS' %}selected{% endif %}>TZS - Tanzanian Shilling</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Currency Symbol</label>
                            <input type="text" class="form-control" name="currency_symbol" value="{{ branch.currency_symbol|default:'KSh' }}" placeholder="e.g., KSh, $, €">
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="is_active" id="isActive" {% if branch.is_active or not branch %}checked{% endif %}>
                        <label class="form-check-label" for="isActive">Active</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            {% if branch %}Update Branch{% else %}Create Branch{% endif %}
                        </button>
                        <a href="/company/branches/" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
